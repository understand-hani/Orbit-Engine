<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>圆周引擎 / Orbit Engine</title>
    <link rel="stylesheet" href="./style.css?v=20260804h" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Orbit Engine</p>
          <h1>圆周引擎</h1>
        </div>
        <span class="mode-pill" id="apiStatus">Connecting</span>
      </header>

      <section class="view active" id="todayView">
        <section class="panel intro-panel">
          <h2>今日</h2>
          <p>固定节奏、材料包、工作区和完成记录。</p>
        </section>

        <section class="panel">
          <div class="segmented" role="group" aria-label="Session mode">
            <button class="active" type="button" data-mode="scheduled">Scheduled</button>
            <button type="button" data-mode="manual">Manual</button>
          </div>
          <div id="manualPicker" class="manual-picker hidden"></div>
        </section>

        <section class="panel">
          <div class="section-title">
            <p>任务</p>
            <button id="refreshToday" type="button">刷新</button>
          </div>
          <div id="todayCard" class="task-card muted">正在加载今日任务...</div>
        </section>
      </section>

      <section class="view" id="workspaceView">
        <section class="detail-nav">
          <button id="backToday" type="button">返回</button>
          <div>
            <p class="eyebrow" id="detailType">Workspace</p>
            <h2 id="detailTitle">今日任务</h2>
          </div>
        </section>

        <section class="panel">
          <div id="workspace" class="workspace muted">先选择一个任务。</div>
        </section>

        <section class="panel" id="checkinPanel">
          <div class="section-title">
            <p>Check-in</p>
            <span id="workspaceStatus">active</span>
          </div>
          <form id="checkinForm" class="checkin-form">
            <label>
              Summary
              <textarea id="summary" rows="3" required>完成了今天的 Deep Dive 任务闭环。</textarea>
            </label>
            <label>
              Key insight
              <textarea id="keyInsight" rows="2">Agent 的价值不在提醒，而在把材料、任务、证据和下一步组织成闭环。</textarea>
            </label>
            <label>
              Next action
              <input id="nextAction" value="接入真实材料源并强化 Deep Dive 指引。" />
            </label>
            <button class="primary" type="submit">完成并写入 History</button>
          </form>
        </section>
      </section>

      <section class="view" id="itemDetailView">
        <section class="detail-nav">
          <button id="backWorkspace" type="button">返回</button>
          <div>
            <p class="eyebrow" id="itemDetailType">Detail</p>
            <h2 id="itemDetailTitle">详情</h2>
          </div>
        </section>
        <section class="panel">
          <div id="itemDetailBody" class="ios-list"></div>
        </section>
      </section>

      <section class="view" id="historyView">
        <section class="panel intro-panel">
          <h2>历史</h2>
          <p>查看已完成的 session、打卡摘要和下一步行动。</p>
        </section>
        <section class="panel">
          <div class="section-title">
            <p>记录</p>
            <button id="refreshHistory" type="button">刷新</button>
          </div>
          <div id="historyList" class="history-list muted">暂无打卡记录。</div>
        </section>
      </section>

      <section class="view" id="settingsView">
        <section class="panel intro-panel">
          <h2>设置</h2>
          <p>当前比赛 demo 使用固定 Deep Dive 日期，保证录屏链路稳定。</p>
        </section>
        <section class="panel settings-list">
          <div><span>Demo date</span><strong id="demoDateLabel">2026-08-06</strong></div>
          <div><span>Backend</span><strong id="apiBaseLabel">-</strong></div>
          <div><span>AI provider</span><strong>mock</strong></div>
          <div><span>Delivery</span><strong>Mobile Web</strong></div>
        </section>
      </section>

      <nav class="tabbar" aria-label="Main tabs">
        <button class="active" type="button" data-tab="todayView">
          <span class="tab-icon calendar-icon"></span>
          <span>今日</span>
        </button>
        <button type="button" data-tab="historyView">
          <span class="tab-icon history-icon"></span>
          <span>历史</span>
        </button>
        <button type="button" data-tab="settingsView">
          <span class="tab-icon settings-icon"></span>
          <span>设置</span>
        </button>
      </nav>
    </main>

    <script src="./app.js?v=20260804h"></script>
  </body>
</html>
